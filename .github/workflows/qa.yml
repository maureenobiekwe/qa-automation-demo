name: QA

on:
  pull_request:          # fast checks gate every PR
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # full regression daily at 06:00 UTC

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Web and API tests
        run: npx playwright test
        env:
          BOOKER_PASS: ${{ secrets.BOOKER_PASS }}
      - name: Postman collection (Newman)
        run: npx newman run postman/booking-api.postman_collection.json --env-var bookerPass=${{ secrets.BOOKER_PASS }} --reporters cli,junit --reporter-junit-export results/newman.xml
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            playwright-report/
            test-results/
            results/
